<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernkasten</title>
<meta name="description" content="Lernkarten mit Wiederholung in Abständen und Statistik. Alles bleibt auf deinem Gerät.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lernkasten">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131C" media="(prefers-color-scheme: dark)">
<link rel="preload" href="fonts/atkinson-hyperlegible-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Schriften liegen lokal (nur Latin-Zeichensatz, Lizenzen in fonts/); fehlende Zeichen zeigt die Systemschrift */
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-400.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-700.woff2) format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-weight:600 800;font-display:swap;src:url(fonts/bricolage-grotesque.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-500.woff2) format("woff2")}
:root{color-scheme:light;accent-color:var(--accent);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one narrow app column, segmented tabs on top, the index card as the hero of the learn view */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#172033; --muted:#566074; --line:#D7DDE7;
  --accent:#2C4BD6; --accent-soft:#E3E8FB; --on-accent:#FFFFFF;
  --ok:#0F7556; --ok-soft:#DDF1E9; --bad:#B9400B; --bad-soft:#FBE7DC;
  --rule:#C9D3F2; --margin:#E29A9A;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131C; --surface:#171E2B; --ink:#E7EBF3; --muted:#9EA9BC; --line:#2B3548;
  --accent:#8FA2FF; --accent-soft:#232C4A; --on-accent:#0E131C;
  --ok:#4CC79A; --ok-soft:#173329; --bad:#F2925A; --bad-soft:#3A2418;
  --rule:#2A3550; --margin:#7A4048; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131C; --surface:#171E2B; --ink:#E7EBF3; --muted:#9EA9BC; --line:#2B3548;
  --accent:#8FA2FF; --accent-soft:#232C4A; --on-accent:#0E131C;
  --ok:#4CC79A; --ok-soft:#173329; --bad:#F2925A; --bad-soft:#3A2418;
  --rule:#2A3550; --margin:#7A4048; color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:700 14px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer;min-height:36px}
nav.tabs button:not([aria-current]):hover{color:var(--ink);background:var(--bg)}
nav.tabs button[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
button,.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.015em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.15}
h2{font-size:20px}
h3{font-size:16px;font-family:var(--f-body);font-weight:700;letter-spacing:0}
.muted{color:var(--muted)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{font:700 15px var(--f-body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn:active,nav.tabs button:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 85%,var(--ink));border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.btn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],input[type=number],textarea,select{width:100%;box-sizing:border-box;font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;flex:1 1 220px;min-width:0}
label.check{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;min-height:44px;cursor:pointer}
label.check input{width:20px;height:20px;margin:0;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Today */
.today{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.big{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:1;letter-spacing:-.03em}
@media (max-width:520px){.today{grid-template-columns:1fr}}
.decks{display:flex;flex-direction:column}
.deck{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.deck:first-child{border-top:0;padding-top:0}
.deck .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
@media (max-width:520px){.deck{grid-template-columns:1fr}}

/* Learn: the index card */
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:280px;padding:56px 24px 16px 52px;
  background-image:linear-gradient(var(--surface) 0 0),repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  background-size:100% 44px,100% 100%;background-repeat:no-repeat,repeat;box-shadow:0 1px 0 var(--line),0 12px 24px -16px rgba(20,30,60,.35);
  display:flex;flex-direction:column;gap:18px}
.card[data-act]{cursor:pointer}
.card::before{content:"";position:absolute;top:0;bottom:0;left:36px;width:2px;background:var(--margin)}
.card .tag{position:absolute;top:12px;left:52px;right:16px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.card .q{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.card .a{font-size:20px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;border-top:2px dashed var(--line);padding-top:16px}
.card .tools{display:flex;gap:4px;justify-content:flex-end;margin-top:auto}
.typed{font-size:15px;border-radius:8px;padding:8px 12px;overflow-wrap:anywhere}
.typed.ok{background:var(--ok-soft);color:var(--ok)}
.typed.bad{background:var(--bad-soft);color:var(--bad)}
/* Bewerten bleibt am unteren Rand erreichbar, auch bei langen Antworten */
.actions{position:sticky;bottom:0;z-index:5;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:10px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answer .btn{min-height:60px;font-size:17px;flex-direction:column;gap:0}
.answer small{font-weight:400;font-size:12px;opacity:.85}
.btn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.wrong:hover,.btn.right:hover{box-shadow:inset 0 0 0 1px currentColor}
.keys{font-size:13px;color:var(--muted);text-align:center}
@media (hover:none){.keys{display:none}}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.f-ok{fill:var(--ok)} .f-bad{fill:var(--bad)} .f-acc{fill:var(--accent)} .f-line{fill:var(--line)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.boxes{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.boxes span{height:100%}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.li .t{min-width:0;overflow-wrap:anywhere}
.bar{height:8px;border-radius:4px;background:var(--bad-soft);overflow:hidden;width:120px}
.bar span{display:block;height:100%;background:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:20}
.toast:empty{opacity:0;pointer-events:none}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:14px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}

/* Handy: Navigation unten in Daumennähe; beim Lernen und Tippen ausgeblendet */
@media (max-width:620px){
  nav.tabs{position:fixed;z-index:10;left:max(12px, env(safe-area-inset-left, 0px));right:max(12px, env(safe-area-inset-right, 0px));bottom:calc(10px + env(safe-area-inset-bottom, 0px));flex-wrap:nowrap;box-shadow:0 8px 24px -12px rgba(20,30,60,.45)}
  nav.tabs button{flex:1;min-height:44px;padding-inline:4px}
  body{padding-bottom:96px}
  html{scroll-padding-bottom:96px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
  body.learning{padding-bottom:20px}
  body.learning nav.tabs,body:has(input:focus,textarea:focus,select:focus) nav.tabs{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="7" width="22" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="7" y="3" width="20" height="16" rx="2" fill="var(--accent)"/><path d="M11 9h12M11 13h8" stroke="var(--on-accent)" stroke-width="2" stroke-linecap="round"/></svg>
      Lernkasten
    </h1>
    <nav class="tabs" aria-label="Bereiche">
      <button data-act="nav" data-v="home">Lernen</button>
      <button data-act="nav" data-v="decks">Stapel</button>
      <button data-act="nav" data-v="stats">Statistik</button>
      <button data-act="nav" data-v="data">Daten</button>
    </nav>
  </header>
  <div id="warn" class="warn" hidden>Dein Browser blockiert gerade den Speicher. Du kannst lernen, aber der Fortschritt geht beim Schließen verloren. Sichere ihn unter „Daten“.</div>
  <main id="app"></main>
</div>
<div id="toast" class="toast" role="status"></div>
<div id="sr" class="sr" aria-live="polite"></div>

<script>
(function(){
const KEY='lernkasten.v1', DAY=86400000, KEEP_DAYS=365;
const LANGS=[['de-DE','Deutsch'],['en-US','Englisch (US)'],['en-GB','Englisch (UK)'],['fr-FR','Französisch'],['es-ES','Spanisch'],['it-IT','Italienisch'],['pt-PT','Portugiesisch'],['nl-NL','Niederländisch'],['pl-PL','Polnisch'],['tr-TR','Türkisch'],['ru-RU','Russisch'],['ar-SA','Arabisch']];
const canSpeak='speechSynthesis' in window;
let storageOk=true;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const norm=s=>String(s).toLowerCase().replace(/\s+/g,' ').replace(/^[\s.,;:!?"'„“()-]+|[\s.,;:!?"'„“()-]+$/g,'');
const plural=(n,one,many)=>n+' '+(n===1?one:many);

const fresh=()=>({decks:[],cards:[],log:[],old:{n:0,ok:0,d:{}}});
function seed(){
  const d={id:uid(),name:'Beispiel: Englisch-Vokabeln',created:Date.now(),langFront:'en-US',langBack:'de-DE'};
  const pairs=[['to achieve','erreichen, schaffen'],['reliable','zuverlässig'],['to postpone','verschieben'],['appointment','Termin'],['to require','erfordern, benötigen'],['opportunity','Gelegenheit, Chance'],['to improve','verbessern'],['invoice','Rechnung']];
  return {...fresh(),decks:[d],cards:pairs.map(p=>newCard(d.id,p[0],p[1]))};
}
function newCard(deckId,front,back){return {id:uid(),deckId,front,back,created:Date.now(),ease:2.5,interval:0,reps:0,due:Date.now(),right:0,wrong:0,lapses:0,last:null}}
// Rückwärts-Karte: eigene Lernwerte, den Text holt qa() vertauscht von der Original-Karte
const reverseOf=c=>({...newCard(c.deckId,'',''),of:c.id});
// Speicher und Sicherungen kommen von außen: Felder prüfen und ergänzen, damit die App immer startet
function normalize(o){
  if(!o||!Array.isArray(o.decks)||!Array.isArray(o.cards))return null;
  const decks=o.decks.filter(d=>d&&d.id!=null&&typeof d.name==='string').map(d=>({...d,id:String(d.id)}));
  const dids=new Set(decks.map(d=>d.id));
  let cards=o.cards.filter(c=>c&&c.id!=null&&dids.has(String(c.deckId))&&(c.of!=null||typeof c.front==='string'&&typeof c.back==='string'))
    .map(c=>{const base=newCard(String(c.deckId),'',''),x={...base,...c,id:String(c.id),deckId:String(c.deckId)};
      ['created','ease','interval','reps','due','right','wrong','lapses'].forEach(k=>{if(!Number.isFinite(x[k]))x[k]=base[k]}); // Zahlen landen im HTML
      ['last','first'].forEach(k=>{if(x[k]!=null&&!Number.isFinite(x[k]))x[k]=null});
      if(x.of!=null)x.of=String(x.of);return x});
  const cids=new Set(cards.filter(c=>c.of==null).map(c=>c.id));
  cards=cards.filter(c=>c.of==null||cids.has(c.of));
  const log=Array.isArray(o.log)?o.log.filter(l=>l&&Number.isFinite(l.t)):[];
  const od=o.old&&o.old.d&&typeof o.old.d==='object'?Object.fromEntries(Object.entries(o.old.d).filter(([,v])=>Array.isArray(v)&&v.length===2&&v.every(Number.isFinite))):{};
  const old=o.old&&Number.isFinite(o.old.n)&&Number.isFinite(o.old.ok)?{n:o.old.n,ok:o.old.ok,d:od}:{n:0,ok:0,d:{}};
  return prune({...o,decks,cards,log,old,newPerDay:Number.isFinite(o.newPerDay)?o.newPerDay:undefined});
}
// Protokoll schlank halten: Antworten älter als ein Jahr nur noch als Summe (gesamt und je Stapel)
// shortcut: die Lernserie zählt dadurch höchstens 365 Tage zurück; bei Bedarf Lerntage zusätzlich in old merken
function prune(s){
  const cut=Date.now()-KEEP_DAYS*DAY;
  if(!s.log.some(l=>l.t<cut))return s;
  const old={n:s.old.n,ok:s.old.ok,d:{...s.old.d}};
  s.log=s.log.filter(l=>{if(l.t>=cut)return true;const x=old.d[l.d]||(old.d[l.d]=[0,0]);old.n++;x[0]++;if(l.ok){old.ok++;x[1]++}return false});
  s.old=old;return s;
}
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=normalize(JSON.parse(s));if(o)return o}}catch(e){storageOk=false}return seed()}
let S=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false}
  document.getElementById('warn').hidden=storageOk;
  // einmal bitten, dass der Browser die Daten nicht bei Platzmangel löscht
  if(!save.asked&&navigator.storage&&navigator.storage.persist){save.asked=true;navigator.storage.persist().catch(()=>{})}
}

// UI state (not persisted)
let view='home', editDeck=null, editCard=null, armed=null, armedTimer=null, sess=null, query='', hist=0;
const app=document.getElementById('app');

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;clearTimeout(toast._t);toast._t=setTimeout(()=>t.textContent='',2200)}
function announce(msg){const sr=document.getElementById('sr');if(sr.textContent!==msg)sr.textContent=msg}
function arm(id){armed=id;clearTimeout(armedTimer);armedTimer=setTimeout(()=>{armed=null;render()},4000)}
const newPerDay=()=>S.newPerDay??20;
const byId=id=>S.cards.find(c=>c.id===id);
const deckOf=c=>S.decks.find(d=>d.id===c.deckId)||{};
const qa=c=>{if(c.of==null)return [c.front,c.back];const o=byId(c.of)||{};return [o.back||'',o.front||'']};
const originals=deckId=>S.cards.filter(c=>c.of==null&&c.deckId===deckId);
// Lernbare Karten: Originale plus Rückwärts-Karten der Stapel, bei denen „rückwärts“ an ist
function items(deckId){const both=new Set(S.decks.filter(d=>d.both).map(d=>d.id));return S.cards.filter(c=>(!deckId||c.deckId===deckId)&&(c.of==null||both.has(c.deckId)))}
function addCard(d,front,back){
  if(originals(d.id).some(c=>norm(c.front)===norm(front)&&norm(c.back)===norm(back)))return false;
  const c=newCard(d.id,front,back);S.cards.push(c);if(d.both)S.cards.push(reverseOf(c));return true;
}

// --- Navigation: jede Ansicht bekommt einen Verlaufseintrag, damit die Zurück-Taste (Android) in der App bleibt ---
// Nur tiefere Ansichten bekommen einen neuen Eintrag (Start → Bereich → Stapel → Lernrunde), sonst ersetzen: der Verlauf bleibt kurz
const rank=(v,d)=>v==='home'?0:v==='learn'?3:v==='decks'&&d?2:1;
function show(v,d){view=v;editDeck=d||null;editCard=null;query='';if(v!=='learn')sess=null}
function go(v,d,from){
  if(v==='home'){const n=hist;hist=0;if(n>0)history.go(-n);else{show('home');render()}return} // popstate zeichnet; hist sofort 0, damit ein Doppel-Tipp nicht aus der App führt
  const push=v==='learn'||rank(v,d)>rank(view,editDeck);
  show(v,d);
  const st={v,d:editDeck,from,n:push?++hist:hist},url='#'+(editDeck?'stapel/'+editDeck:v);
  if(push)history.pushState(st,'',url);else history.replaceState(st,'',url);
  render();
}
addEventListener('popstate',e=>{const s=e.state||{v:'home',n:0};hist=s.n||0;show(s.v==='learn'?'home':s.v,s.d);render()}); // eine Lernrunde lässt sich nicht per Verlauf fortsetzen

// --- Dateien ---
const cell=s=>/[";\t\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
// Zeilen aus „Frage ; Antwort“, Tab (Excel) oder CSV mit "…" und "" als Anführungszeichen
function parseRows(txt,quotes=true){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch!=='"')f+=ch;else if(txt[i+1]==='"'){f+='"';i++}
      else{q=false;let j=i+1;while(txt[j]===' ')j++;if(j<txt.length&&!';\t\r\n'.includes(txt[j]))f='"'+f+'"'}} // Text nach dem Schluss-Anführungszeichen: war kein CSV-Feld
    else if(quotes&&ch==='"'&&!f.trim()){q=true;f=''}
    else if(ch===';'||ch==='\t'){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=ch}
  if(q)return parseRows(txt,false); // offenes Anführungszeichen bis zum Ende: alles wörtlich nehmen
  row.push(f);rows.push(row);return rows;
}
// Handy: Teilen-Menü (z. B. „In Dateien sichern“), sonst normaler Download
async function saveFile(name,text,type){
  const file=new File([text],name,{type});
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
}
const fileName=s=>s.replace(/[\\/:*?"<>|]+/g,'-').trim()||'stapel';

// --- scheduling ---
const isNew=c=>c.right+c.wrong===0;
function dueCards(deckId){
  const now=Date.now(), today=startOfDay(now);
  const cs=items(deckId).filter(c=>c.due<=now);
  const rev=cs.filter(c=>!isNew(c)).sort((a,b)=>a.due-b.due);
  const left=Math.max(0,newPerDay()-S.cards.filter(c=>c.first>=today).length); // Tageslimit für neue Karten
  const nw=cs.filter(isNew).sort((a,b)=>a.created-b.created).slice(0,left);
  return {rev,nw,count:rev.length+nw.length};
}
function fmtInt(days){if(days<=0)return 'heute';if(days===1)return '1 Tag';if(days<31)return days+' Tage';if(days<365)return Math.round(days/30)+' Mon.';return (days/365).toFixed(1).replace('.',',')+' J.'}
function nextInterval(c,ok){
  if(!ok)return 0;
  if(sess&&sess.failed.has(c.id))return 1;
  if(c.reps===0)return 1; if(c.reps===1)return 3;
  return Math.max(c.interval+1,Math.round(c.interval*c.ease));
}
function answer(ok){
  const id=sess.queue[0], c=byId(id); if(!c)return;
  sess.undo={c:{...c},queue:sess.queue.slice(),done:sess.done,right:sess.right,wrong:sess.wrong,failed:new Set(sess.failed),typed:sess.typed,log:S.log.length};
  const now=Date.now();
  if(isNew(c))c.first=now;
  S.log.push({t:now,c:c.id,d:c.deckId,ok:ok?1:0});
  if(ok){c.right++;sess.right++}else{c.wrong++;sess.wrong++}
  c.last=now;
  sess.queue.shift();
  if(sess.mode==='learn'){
    if(ok){
      const iv=nextInterval(c,true);
      c.interval=iv; c.reps=sess.failed.has(c.id)?1:c.reps+1;
      c.ease=Math.min(3.0,c.ease+(sess.failed.has(c.id)?0:0.05));
      c.due=startOfDay(now)+iv*DAY+4*3600000;
      sess.done++;
    }else{
      c.reps=0;c.interval=0;c.lapses++;c.ease=Math.max(1.3,c.ease-0.2);c.due=now;
      sess.failed.add(c.id);
      sess.queue.splice(Math.min(3,sess.queue.length),0,c.id); // kommt nach 3 Karten wieder
    }
  }else{ // Schwachstellen-Training: falsche kommen auch hier wieder
    if(!ok){sess.queue.splice(Math.min(3,sess.queue.length),0,c.id);c.ease=Math.max(1.3,c.ease-0.1);c.due=Math.min(c.due,now)}
    else sess.done++;
  }
  sess.revealed=false;sess.typed=null;
  save(); render();
}
function undo(){
  const u=sess&&sess.undo;if(!u)return;
  const i=S.cards.findIndex(x=>x.id===u.c.id);if(i>=0)S.cards[i]=u.c;
  S.log.length=u.log;
  Object.assign(sess,{queue:u.queue,done:u.done,right:u.right,wrong:u.wrong,failed:u.failed,typed:u.typed,revealed:true,undo:null});
  save();render();toast('Antwort zurückgenommen');
}
function startSession(deckId,mode){
  let ids;
  if(mode==='weak'){
    ids=items(deckId).filter(c=>c.wrong>0)
      .sort((a,b)=>(b.wrong/(b.right+b.wrong))-(a.wrong/(a.right+a.wrong))||b.wrong-a.wrong).slice(0,20).map(c=>c.id);
  }else{const d=dueCards(deckId);ids=d.rev.concat(d.nw).map(c=>c.id)}
  if(!ids.length){toast('Gerade nichts zu lernen');return}
  sess={deckId,mode:mode||'learn',queue:ids,total:ids.length,done:0,right:0,wrong:0,failed:new Set(),revealed:false,typed:null,undo:null};
  go('learn');window.scrollTo(0,0);
}
function typedOk(typed,ans){const t=norm(typed);return !!t&&(t===norm(ans)||ans.split(/[,;/\n]/).some(p=>norm(p)===t))}

function streak(){
  const days=new Set(S.log.map(l=>dayKey(l.t)));let n=0,t=Date.now();
  if(!days.has(dayKey(t)))t-=DAY;
  while(days.has(dayKey(t))){n++;t-=DAY}
  return n;
}
function vStats(){
  const all=items(null);
  const total=S.old.n+S.log.length, ok=S.old.ok+S.log.filter(l=>l.ok).length, q=total?Math.round(ok/total*100):0;
  const learned=all.filter(c=>c.reps>0).length, st=streak();
  // 14-Tage-Diagramm
  const days=[];for(let i=13;i>=0;i--){const t=Date.now()-i*DAY;days.push({k:dayKey(t),d:new Date(t),ok:0,bad:0})}
  const idx=Object.fromEntries(days.map((d,i)=>[d.k,i]));
  S.log.forEach(l=>{const i=idx[dayKey(l.t)];if(i!==undefined){l.ok?days[i].ok++:days[i].bad++}});
  const max=Math.max(4,...days.map(d=>d.ok+d.bad)); const top=Math.ceil(max/4)*4;
  const W=560,H=190,L=34,B=24,T=10,bw=(W-L-8)/14;
  const y=v=>T+(H-T-B)*(1-v/top);
  let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Antworten pro Tag, letzte 14 Tage">`;
  [0,top/2,top].forEach(v=>{svg+=`<line class="grid" x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`});
  days.forEach((d,i)=>{const x=L+i*bw+3,w=bw-6;
    if(d.ok)svg+=`<rect class="f-ok" x="${x}" y="${y(d.ok)}" width="${w}" height="${y(0)-y(d.ok)}" rx="2"/>`;
    if(d.bad)svg+=`<rect class="f-bad" x="${x}" y="${y(d.ok+d.bad)}" width="${w}" height="${y(d.ok)-y(d.ok+d.bad)}" rx="2"/>`;
    if(i%2===1||i===13)svg+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${d.d.getDate()}.${d.d.getMonth()+1}.</text>`});
  svg+='</svg>';
  // Lernstand
  const cats=[['Neu',c=>isNew(c),'var(--line)'],['Am Lernen',c=>!isNew(c)&&c.interval<7,'var(--bad)'],['Gefestigt',c=>c.interval>=7&&c.interval<21,'var(--accent)'],['Sicher',c=>c.interval>=21,'var(--ok)']];
  const cn=cats.map(k=>all.filter(k[1]).length), N=Math.max(1,all.length);
  // Vorschau
  const fc=[];for(let i=0;i<7;i++){const s=startOfDay(Date.now())+i*DAY,e=s+DAY;fc.push(all.filter(c=>i===0?c.due<e:c.due>=s&&c.due<e).length)}
  const fmax=Math.max(1,...fc);
  const wd=['So','Mo','Di','Mi','Do','Fr','Sa'];
  // schwierigste Karten
  const hard=all.filter(c=>c.wrong>0).sort((a,b)=>(b.wrong/(b.right+b.wrong))-(a.wrong/(a.right+a.wrong))||b.wrong-a.wrong).slice(0,8);
  const deckRows=S.decks.map(d=>{const ls=S.log.filter(l=>l.d===d.id),od=S.old.d[d.id]||[0,0],n=ls.length+od[0],o=ls.filter(l=>l.ok).length+od[1];return {d,n,q:n?o/n:0}}).filter(x=>x.n);
  return `<div class="stack">
    <div class="kpis">
      <div class="kpi"><span class="label">Antworten</span><b>${total}</b></div>
      <div class="kpi"><span class="label">Trefferquote</span><b>${total?q+' %':'–'}</b></div>
      <div class="kpi"><span class="label">Lernserie</span><b>${st} <span style="font-size:16px">${st===1?"Tag":"Tage"}</span></b></div>
      <div class="kpi"><span class="label">Gelernt</span><b>${learned}<span class="muted" style="font-size:16px"> / ${all.length}</span></b></div>
    </div>
    <section class="panel"><div class="row between"><h2>Letzte 14 Tage</h2><div class="legend"><span><i style="background:var(--ok)"></i>richtig</span><span><i style="background:var(--bad)"></i>falsch</span></div></div>
      ${S.log.length?svg:'<div class="empty">Sobald du lernst, siehst du hier jeden Tag, wie viel richtig und falsch war.</div>'}</section>
    <section class="panel"><h2>Lernstand der Karten</h2>
      <div class="boxes" aria-hidden="true">${cats.map((k,i)=>cn[i]?`<span style="width:${cn[i]/N*100}%;background:${k[2]}"></span>`:'').join('')}</div>
      <div class="legend">${cats.map((k,i)=>`<span><i style="background:${k[2]}"></i>${k[0]} <b class="num">${cn[i]}</b></span>`).join('')}</div>
      <p class="muted" style="margin:0;font-size:14px">Gefestigt: Intervall ab 7 Tagen. Sicher: ab 21 Tagen. Eine falsche Antwort setzt die Karte zurück auf „Am Lernen“.</p></section>
    <section class="panel"><h2>Was in den nächsten 7 Tagen fällig wird</h2>
      <div class="list">${fc.map((n,i)=>{const d=new Date(Date.now()+i*DAY);return `<div class="li" style="grid-template-columns:70px 1fr 40px"><span class="muted">${i===0?'Heute':wd[d.getDay()]+' '+d.getDate()+'.'}</span><div class="progress" style="height:10px"><span style="width:${n/fmax*100}%"></span></div><b class="num" style="text-align:right">${n}</b></div>`}).join('')}</div></section>
    ${deckRows.length?`<section class="panel"><h2>Trefferquote je Stapel</h2><div class="list">${deckRows.map(x=>`<div class="li"><span class="t">${esc(x.d.name)} <span class="muted num" style="font-size:13px">· ${x.n} Antworten</span></span><div class="row" style="flex-wrap:nowrap"><div class="bar"><span style="width:${x.q*100}%"></span></div><b class="num" style="width:44px;text-align:right">${Math.round(x.q*100)} %</b></div></div>`).join('')}</div></section>`:''}
    <section class="panel"><div class="row between"><h2>Schwierigste Karten</h2>${hard.length?'<button class="btn sm" data-act="weak">Diese üben</button>':''}</div>
      ${hard.length?`<div class="list">${hard.map(c=>`<div class="li"><div class="t"><b>${esc(qa(c)[0])}</b><div class="muted" style="font-size:13px">${esc(deckName(c.deckId))}${c.of!=null?' · rückwärts':''}</div></div><span class="pill bad num">${c.wrong}× falsch · ${Math.round(c.wrong/(c.right+c.wrong)*100)} %</span></div>`).join('')}</div>`
        :'<div class="empty">Noch keine falschen Antworten. Karten, die du falsch hast, landen hier und kommen öfter dran.</div>'}</section>
  </div>`;
}
function vData(){
  return `<div class="stack">
    <section class="panel"><h2>Wo deine Daten liegen</h2><p class="muted" style="margin:0">Alles wird nur in diesem Browser auf diesem Gerät gespeichert. Kein Konto, nichts geht an einen Server. Wer den Browserverlauf löscht, löscht auch die Karten. Sichere sie deshalb ab und zu hier.</p>
      <p class="muted" style="margin:0">Auf dem iPhone hat die installierte App einen eigenen Speicher, getrennt von Safari. Karten, die du in Safari angelegt hast, holst du mit einer Sicherung in die App.</p></section>
    <section class="panel"><h2>Sicherung erstellen</h2><p class="muted" style="margin:0">Speichere die Datei z. B. in iCloud Drive, Google Drive oder als Notiz. Damit kannst du alles auf einem anderen Gerät wiederherstellen.</p>
      <div class="row"><button class="btn primary" data-act="backup">Als Datei sichern</button><button class="btn" data-act="copy">Als Text kopieren</button></div>
      <textarea id="exp" readonly aria-label="Sicherung als Text" style="min-height:110px;font-family:var(--f-mono);font-size:12px"></textarea></section>
    <section class="panel"><h2>Sicherung einspielen</h2>
      <div class="row"><label class="btn">Sicherungsdatei wählen<input type="file" class="sr" accept=".json,application/json,text/plain" data-fill="imp"></label></div>
      <textarea id="imp" aria-label="Sicherungstext" placeholder="…oder Sicherungstext hier einfügen" style="font-family:var(--f-mono);font-size:12px"></textarea>
      <div class="row"><button class="btn ${armed==='imp'?'danger armed':''}" data-act="import">${armed==='imp'?'Ersetzt alle jetzigen Daten. Fortfahren?':'Einspielen'}</button></div></section>
    <section class="panel"><h2>Einstellungen</h2>
      <div class="row"><label class="f" style="flex:0 1 240px">Neue Karten pro Tag<input type="number" id="npd" inputmode="numeric" min="0" max="999" value="${newPerDay()}"></label></div></section>
    <section class="panel"><h2>Neu anfangen</h2><div class="row"><button class="btn danger ${armed==='reset'?'armed':''}" data-act="reset">${armed==='reset'?'Wirklich alles löschen?':'Alle Stapel, Karten und Statistik löschen'}</button></div></section>
  </div>`;
}
// Fokus nach dem Neuzeichnen zurückgeben: gleicher Button, sonst das markierte Ziel der Ansicht
function focusKey(el){const ks=['act','id','ok','v'].filter(k=>el.dataset[k]!=null);return ks.length?ks.map(k=>`[data-${k}="${CSS.escape(el.dataset[k])}"]`).join(''):el.id?'#'+CSS.escape(el.id):null}
function render(){
  const f=document.activeElement, had=app.contains(f), key=had?focusKey(f):null;
  document.body.classList.toggle('learning',view==='learn');
  document.querySelectorAll('nav.tabs button').forEach(b=>{const on=b.dataset.v===(view==='learn'?'home':view);on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current')});
  app.innerHTML=view==='learn'?vLearn():view==='decks'?vDecks():view==='stats'?vStats():view==='data'?vData():vHome();
  if(view==='data'){const e=document.getElementById('exp');if(e)e.value=JSON.stringify(S)}
  if(view==='learn'&&sess&&sess.queue.length&&!editCard){const c=byId(sess.queue[0]);if(c){const [q,a]=qa(c);announce(sess.revealed?'Antwort: '+a:'Frage: '+q)}}
  if(had){const el=(key&&app.querySelector(key))||app.querySelector('[data-focus]');if(el)el.focus({preventScroll:true})}
}

// --- events ---
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;handle(b);
});
document.querySelector('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)handle(b)});
function backToDecks(){if(history.state&&history.state.from==='decks')history.back();else go('decks')}
function handle(b){
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='nav'){const v=b.dataset.v;if(v===view&&!editDeck)return;go(v);return}
  if(a==='learn'){startSession(id||null,'learn');return}
  if(a==='weak'){startSession(null,'weak');return}
  if(a==='reveal'){const t=document.getElementById('typed');if(t)sess.typed=t.value.trim();sess.revealed=true;render();return}
  if(a==='ans'){answer(b.dataset.ok==='1');return}
  if(a==='undo'){undo();return}
  if(a==='speak'){const c=byId(sess.queue[0]);if(!c)return;const d=deckOf(c),[q,an]=qa(c);
    const u=new SpeechSynthesisUtterance(sess.revealed?an:q);
    u.lang=((c.of!=null)!==sess.revealed?d.langBack:d.langFront)||'de-DE'; // bei Rückwärts-Karten ist die Frage die Rückseite
    speechSynthesis.cancel();speechSynthesis.speak(u);return}
  if(a==='edit'){go('decks',id,view);window.scrollTo(0,0);return}
  if(a==='back'){backToDecks();return}
  if(a==='editcard'){editCard=id;render();return}
  if(a==='canceledit'){editCard=null;render();return}
  if(a==='delcard'){if(armed!=='c'+id){arm('c'+id);render();return}
    S.cards=S.cards.filter(c=>c.id!==id&&c.of!==id);armed=null;save();render();toast('Karte gelöscht');return}
  if(a==='deldeck'){if(armed!=='d'+id){arm('d'+id);render();return}
    S.decks=S.decks.filter(d=>d.id!==id);S.cards=S.cards.filter(c=>c.deckId!==id);armed=null;save();backToDecks();toast('Stapel gelöscht');return}
  if(a==='csv'){const d=S.decks.find(x=>x.id===editDeck);if(!d)return;
    const rows=originals(d.id).sort((x,y)=>x.created-y.created).map(c=>cell(c.front)+';'+cell(c.back));
    saveFile(fileName(d.name)+'.csv','﻿'+rows.join('\r\n'),'text/csv');return}
  if(a==='backup'){saveFile('lernkasten-sicherung-'+dayKey(Date.now())+'.json',JSON.stringify(S),'application/json');return}
  if(a==='copy'){const t=document.getElementById('exp');const done=()=>toast('Sicherung kopiert');
    try{navigator.clipboard.writeText(t.value).then(done).catch(()=>{t.select();toast('Text markiert, jetzt kopieren')})}catch(err){t.select();toast('Text markiert, jetzt kopieren')}return}
  if(a==='import'){const raw=document.getElementById('imp').value.trim();let o=null;
    try{o=normalize(JSON.parse(raw))}catch(err){}
    if(!o){toast('Das ist keine gültige Sicherung');return}
    if(armed!=='imp'){arm('imp');render();document.getElementById('imp').value=raw;return}
    S=o;armed=null;save();go('home');toast('Sicherung eingespielt');return}
  if(a==='reset'){if(armed!=='reset'){arm('reset');render();return}
    S=fresh();armed=null;save();go('home');toast('Alles gelöscht');return}
}
app.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='f-newdeck'){const n=document.getElementById('nd-name').value.trim();if(!n)return;const d={id:uid(),name:n,created:Date.now()};S.decks.push(d);save();go('decks',d.id,'decks');toast('Stapel angelegt');return}
  if(f.dataset.form==='typed'){sess.typed=document.getElementById('typed').value.trim();sess.revealed=true;render();return}
  if(f.dataset.form==='editcard'){const c=byId(f.dataset.id);if(c){c.front=document.getElementById('ec-f-'+c.id).value.trim()||c.front;c.back=document.getElementById('ec-b-'+c.id).value.trim()||c.back;save()}
    if(sess)sess.undo=null;editCard=null;render();return}
  const d=S.decks.find(x=>x.id===editDeck);
  if(f.id==='f-deck'&&d){
    d.name=document.getElementById('rn-name').value.trim()||d.name;
    d.both=document.getElementById('ds-both').checked;d.type=document.getElementById('ds-type').checked;
    const lf=document.getElementById('ds-lf');if(lf){d.langFront=lf.value;d.langBack=document.getElementById('ds-lb').value}
    if(d.both){const has=new Set(S.cards.map(c=>c.of));originals(d.id).forEach(c=>{if(!has.has(c.id))S.cards.push(reverseOf(c))})}
    save();render();toast('Gespeichert');return}
  if(f.id==='f-addcard'&&d){const fr=document.getElementById('ac-front').value.trim(),bk=document.getElementById('ac-back').value.trim();if(!fr||!bk)return;
    if(!addCard(d,fr,bk)){toast('Diese Karte gibt es schon');return}
    save();render();document.getElementById('ac-front').focus();toast('Karte gespeichert');return}
  if(f.id==='f-bulk'&&d){let n=0,dup=0;
    parseRows(document.getElementById('bulk').value).forEach(r=>{if(r.length<2)return;const fr=r[0].trim(),bk=r.slice(1).join(';').trim();if(!fr||!bk)return;if(addCard(d,fr,bk))n++;else dup++});
    if(!n&&!dup){toast('Keine Zeile im Format „Frage ; Antwort“ gefunden');return}
    save();render();toast(plural(n,'Karte','Karten')+' importiert'+(dup?`, ${dup} doppelte übersprungen`:''));return}
});
app.addEventListener('input',e=>{
  if(e.target.id!=='q')return;
  const d=S.decks.find(x=>x.id===editDeck);query=e.target.value;
  if(d)document.getElementById('cardlist').innerHTML=cardRows(d); // nur die Liste, damit das Suchfeld den Fokus behält
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='npd'){const v=Math.round(Number(t.value));if(t.value!==''&&v>=0){S.newPerDay=Math.min(999,v);save();toast('Gespeichert')}else t.value=newPerDay();return}
  if(t.type==='file'&&t.dataset.fill){const file=t.files[0];t.value='';if(!file)return;
    file.text().then(txt=>{const ta=document.getElementById(t.dataset.fill);if(ta)ta.value=txt.replace(/^﻿/,'');toast('Datei geladen')})}
});
document.addEventListener('keydown',e=>{
  if(view!=='learn'||!sess||editCard||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=document.activeElement&&document.activeElement.tagName;
  if(/INPUT|TEXTAREA|SELECT/.test(tag))return;
  if((e.key===' '||e.key==='Enter')&&tag==='BUTTON')return; // ein fokussierter Button reagiert selbst
  if((e.key==='z'||e.key==='Z')&&sess.undo){e.preventDefault();undo();return}
  if(!sess.queue.length)return;
  if(!sess.revealed&&(e.key===' '||e.key==='Enter')){e.preventDefault();sess.revealed=true;render();return}
  if(sess.revealed&&(e.key==='1'||e.key==='f')){e.preventDefault();answer(false)}
  if(sess.revealed&&(e.key==='2'||e.key==='r')){e.preventDefault();answer(true)}
});
const st=history.state;
if(st&&st.n>0){hist=st.n;show(st.v==='learn'?'home':st.v,st.d)}else history.replaceState({v:'home',n:0},'');
document.getElementById('warn').hidden=storageOk;
render();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
